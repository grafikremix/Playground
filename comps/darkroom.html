<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground — darkroom</title>
    <link rel="stylesheet" href="./fonts.css" />
    <style>
      :root {
        --black: #070605;
        --safe: #c01418;
        --safe-dim: #6a1214;
        --print: #d8d2c4;
        --ink: #b9b2a4;
        --mute: #6e675c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--black); color: var(--ink); }
      body {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.55;
        min-height: 100dvh;
        background:
          radial-gradient(900px 520px at 92% -8%, #4a0b0c 0%, transparent 58%),
          var(--black);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 40;
        opacity: 0.22;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      .lab {
        position: relative;
        z-index: 1;
        padding: 18px 16px 80px;
        max-width: 1280px;
        margin: 0 auto;
      }
      .ticket {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border: 1px dashed var(--safe-dim);
        padding: 8px 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 10px;
        color: var(--safe);
      }
      .mast {
        margin: 36px 0 28px;
        max-width: 52ch;
      }
      .stamp {
        display: inline-block;
        border: 2px solid var(--safe);
        color: var(--safe);
        letter-spacing: 0.42em;
        font-size: 13px;
        padding: 8px 12px 7px 16px;
        text-transform: uppercase;
      }
      .lede {
        margin: 22px 0 0;
        color: var(--ink);
      }
      .hint {
        margin: 10px 0 0;
        color: var(--mute);
      }
      .sheet {
        display: grid;
        grid-template-columns: 18px 1fr 18px;
        gap: 0;
        margin-top: 32px;
      }
      .sprocket {
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0 18px,
            #1a1917 18px 22px,
            transparent 22px 40px
          );
        border-left: 1px solid #1c1b19;
        border-right: 1px solid #1c1b19;
      }
      .sprocket span {
        display: block;
        width: 10px;
        height: 10px;
        margin: 15px auto;
        border: 1px solid #3a3936;
        border-radius: 1px;
        background: #050505;
        box-shadow: inset 0 0 0 2px #0d0c0b;
      }
      .grid {
        list-style: none;
        margin: 0;
        padding: 10px 8px 18px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px 14px;
        background: #0c0b0a;
      }
      .tile { margin: 0; }
      .print {
        display: block;
        text-decoration: none;
        color: inherit;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .window {
        position: relative;
        aspect-ratio: 1;
        background: var(--print);
        padding: 7px;
        box-shadow: 0 0 0 1px #2a2723;
      }
      .still { position: absolute; inset: 7px; overflow: hidden; }
      .still-layer, .still-layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .still-bw img { filter: grayscale(1) contrast(1.45) brightness(0.82); }
      .still-color {
        --mx: 50%;
        --my: 50%;
        --r: 0px;
        -webkit-mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0px, #000 var(--r), transparent calc(var(--r) + min(80px, var(--r) + 0.1px)));
        mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0px, #000 var(--r), transparent calc(var(--r) + min(80px, var(--r) + 0.1px)));
      }
      .meta {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 10px;
        margin-top: 8px;
        align-items: baseline;
      }
      .num { color: var(--safe); letter-spacing: 0.14em; }
      .meta h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #d7cfc0;
      }
      .meta p {
        grid-column: 2;
        margin: 0;
        color: var(--mute);
      }
      .end {
        margin-top: 40px;
        color: var(--mute);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 10px;
      }
      @media (min-width: 560px) {
        .grid { grid-template-columns: 1fr 1fr; }
        .tile-feature { grid-column: span 2; grid-row: span 2; }
        .tile-feature .meta h2 { font-size: 16px; }
      }
      @media (min-width: 1100px) {
        .grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="lab">
      <div class="ticket">
        <span>grafikremix · batch 08</span>
        <span>safe light on</span>
        <span>2026</span>
      </div>
      <header class="mast">
        <div class="stamp">Playground</div>
        <p class="lede" id="lede"></p>
        <p class="hint">Eight contact prints. Hold a frame for colour. Tap to go in.</p>
      </header>
      <div class="sheet">
        <div class="sprocket" aria-hidden="true"></div>
        <ol class="grid" id="grid"></ol>
        <div class="sprocket" aria-hidden="true"></div>
      </div>
      <p class="end">Do not expose · fix · wash · dry</p>
    </div>
    <script type="module">
      import { experiments, lede, picture } from './catalog.js'
      import { bindTiles } from './bloom.js'
      document.getElementById('lede').textContent = lede
      document.querySelectorAll('.sprocket').forEach((el) => {
        el.innerHTML = Array.from({ length: 28 }, () => '<span></span>').join('')
      })
      document.getElementById('grid').innerHTML = experiments
        .map(
          (s) => `
        <li class="tile ${s.featured ? 'tile-feature' : ''}" data-tile>
          <a class="print" data-hit href="../specimens/${s.slug}.html" draggable="false">
            <div class="window">
              <div class="still">${picture(s.slug, 'still-bw', s.title, s.blurb)}${picture(s.slug, 'still-color', s.title, s.blurb)}</div>
            </div>
            <div class="meta">
              <span class="num">${s.n}</span>
              <h2>${s.title}</h2>
              <p>${s.blurb}</p>
            </div>
          </a>
        </li>`,
        )
        .join('')
      bindTiles()
    </script>
  </body>
</html>
