<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal A — P1 green / JetBrains Mono</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./terminal-shell.css" />
    <style>
      :root {
        --bg: #010301;
        --p: #5dff61;
        --p-dim: #1f6a28;
        --p-soft: #7dcb7e;
        --p-hi: #c8ffc6;
        --glow: rgba(70, 255, 90, 0.22);
        --body: 'JetBrains Mono', ui-monospace, monospace;
        --display: 'JetBrains Mono', ui-monospace, monospace;
      }
      h1 {
        letter-spacing: 0.02em;
        font-weight: 500;
        text-transform: none;
      }
      .row h2 { font-weight: 500; letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div class="crt">
      <div class="bar">
        <span>grafikremix@studio</span>
        <span><b>PLAYGROUND</b></span>
        <span>var A · P1 green</span>
        <span>JetBrains Mono</span>
        <span>2026</span>
      </div>
      <h1>ls ./stills</h1>
      <p class="lede" id="lede"></p>
      <p class="prompt">$ <span>hold a frame for colour. tap to open.</span></p>
      <ol class="grid" id="grid"></ol>
    </div>
    <script type="module">
      import { mountTerminal } from './terminal-kit.js'
      await mountTerminal()
    </script>
  </body>
</html>
