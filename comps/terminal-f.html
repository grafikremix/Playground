<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal F — bone / Doto + Plex Mono</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./terminal-shell.css" />
    <style>
      :root {
        --bg: #1b1d1f;
        --p: #e6dfd1;
        --p-dim: #6d6a64;
        --p-soft: #b7b0a4;
        --p-hi: #f4f0e6;
        --glow: rgba(230, 223, 209, 0.08);
        --body: 'IBM Plex Mono', ui-monospace, monospace;
        --display: Doto, ui-monospace, monospace;
        --still-bg: #141618;
      }
      body { text-shadow: none; }
      h1 {
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: clamp(22px, 5vw, 30px);
      }
      .row h2 {
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="crt">
      <div class="bar">
        <span>grafikremix@studio</span>
        <span><b>PLAYGROUND</b></span>
        <span>var F · bone</span>
        <span>Doto + Plex Mono</span>
        <span>2026</span>
      </div>
      <h1>ls ./stills</h1>
      <p class="lede" id="lede"></p>
      <p class="prompt">$ <span>hold a frame for colour. tap to open.</span></p>
      <ol class="grid" id="grid"></ol>
    </div>
    <script type="module">
      import { mountTerminal } from './terminal-kit.js'
      await mountTerminal()
    </script>
  </body>
</html>
