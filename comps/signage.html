<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground — night signage</title>
    <link rel="stylesheet" href="./fonts.css" />
    <style>
      :root {
        --void: #05070c;
        --acid: #d6ff32;
        --paper: #ece7d8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--void); color: var(--paper); }
      body {
        font-family: Oswald, 'Arial Narrow', sans-serif;
        font-weight: 400;
        min-height: 100dvh;
      }
      .wrap { position: relative; }
      .mast {
        padding: 22px 18px 0;
        border-bottom: 6px solid var(--acid);
      }
      .rail {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--acid);
        margin-bottom: 18px;
      }
      h1 {
        font-family: 'Bebas Neue', Oswald, sans-serif;
        font-size: clamp(64px, 16vw, 168px);
        line-height: 0.82;
        letter-spacing: 0.01em;
        margin: 0;
        font-weight: 400;
        text-transform: uppercase;
      }
      .band {
        display: grid;
        gap: 8px;
        padding: 18px 18px 22px;
        margin-top: 0;
        background: var(--void);
      }
      .lede {
        margin: 0;
        max-width: 46ch;
        font-size: 18px;
        line-height: 1.35;
        letter-spacing: 0.02em;
        color: var(--paper);
      }
      .hint {
        margin: 0;
        color: var(--acid);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 12px;
      }
      .grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr;
        gap: 2px;
        background: var(--acid);
        border-top: 2px solid var(--acid);
      }
      .tile {
        margin: 0;
        background: var(--void);
        min-width: 0;
      }
      .hit {
        display: block;
        position: relative;
        aspect-ratio: 1;
        text-decoration: none;
        color: inherit;
        overflow: hidden;
        -webkit-touch-callout: none;
        user-select: none;
      }
      .still, .still-layer, .still-layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .still-bw img { filter: grayscale(1) contrast(1.55) brightness(0.62); }
      .still-color {
        --mx: 50%;
        --my: 50%;
        --r: 0px;
        -webkit-mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0px, #000 var(--r), transparent calc(var(--r) + min(80px, var(--r) + 0.1px)));
        mask-image: radial-gradient(circle at var(--mx) var(--my), #000 0px, #000 var(--r), transparent calc(var(--r) + min(80px, var(--r) + 0.1px)));
      }
      .num {
        position: absolute;
        top: -6px;
        left: 6px;
        z-index: 3;
        font-family: 'Bebas Neue', Oswald, sans-serif;
        font-size: clamp(72px, 18vw, 140px);
        line-height: 0.8;
        color: var(--acid);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      .copy {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 3;
        pointer-events: none;
      }
      .copy h2 {
        font-family: 'Bebas Neue', Oswald, sans-serif;
        font-size: clamp(28px, 6vw, 44px);
        line-height: 0.9;
        margin: 0;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .copy p {
        margin: 6px 0 0;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--acid);
      }
      @media (min-width: 560px) {
        .grid { grid-template-columns: 1fr 1fr; }
        .band { grid-template-columns: 1.4fr 0.8fr; align-items: end; }
        .hint { text-align: right; }
      }
      @media (min-width: 1100px) {
        .grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
        h1 { font-size: 168px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="mast">
        <div class="rail">
          <span>grafikremix</span>
          <span>not a design system</span>
          <span>2026</span>
        </div>
        <h1>Playground</h1>
      </header>
      <div class="band">
        <p class="lede" id="lede"></p>
        <p class="hint">Eight stills. Hold a tile for colour.<br />Tap to go in.</p>
      </div>
      <ol class="grid" id="grid"></ol>
    </div>
    <script type="module">
      import { experiments, lede, picture } from './catalog.js'
      import { bindTiles } from './bloom.js'
      document.getElementById('lede').textContent = lede
      document.getElementById('grid').innerHTML = experiments
        .map(
          (s) => `
        <li class="tile" data-tile>
          <a class="hit" data-hit href="../specimens/${s.slug}.html" draggable="false">
            <div class="still">${picture(s.slug, 'still-bw', s.title, s.blurb)}${picture(s.slug, 'still-color', s.title, s.blurb)}</div>
            <span class="num">${s.n}</span>
            <div class="copy">
              <h2>${s.title}</h2>
              <p>${s.blurb}</p>
            </div>
          </a>
        </li>`,
        )
        .join('')
      bindTiles()
    </script>
  </body>
</html>
