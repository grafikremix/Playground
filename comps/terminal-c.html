<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal C — ice phosphor / Silkscreen + Plex Mono</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./terminal-shell.css" />
    <style>
      :root {
        --bg: #02050c;
        --p: #b7ecff;
        --p-dim: #3d6f88;
        --p-soft: #7fb6cc;
        --p-hi: #e7f8ff;
        --glow: rgba(160, 220, 255, 0.2);
        --body: 'IBM Plex Mono', ui-monospace, monospace;
        --display: Silkscreen, ui-monospace, monospace;
        --still-bg: #010308;
      }
      h1 {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: clamp(18px, 4.2vw, 26px);
        line-height: 1.45;
      }
      .row h2 {
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="crt">
      <div class="bar">
        <span>grafikremix@studio</span>
        <span><b>PLAYGROUND</b></span>
        <span>var C · ice</span>
        <span>Silkscreen + Plex Mono</span>
        <span>2026</span>
      </div>
      <h1>ls ./stills</h1>
      <p class="lede" id="lede"></p>
      <p class="prompt">$ <span>hold a frame for colour. tap to open.</span></p>
      <ol class="grid" id="grid"></ol>
    </div>
    <script type="module">
      import { mountTerminal } from './terminal-kit.js'
      await mountTerminal()
    </script>
  </body>
</html>
